name: Build

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths-ignore:
      - '**.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TAMMY_BUILD_FLAVOR: PROD

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-14
            tasks: packageReleaseDmg
            artifact-paths: |
              build/compose/binaries/main-release/dmg/*.dmg
          - name: linux-x64
            os: ubuntu-latest
            tasks: packageReleasePlatformZip
            artifact-paths: |
              build/compose/binaries/main-release/zip/*.zip
          - name: windows-x64
            os: windows-latest
            tasks: packageReleasePlatformZip
            artifact-paths: |
              build/compose/binaries/main-release/zip/*.zip
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build packages
        shell: bash
        # c2x conventions derive the app version from GitLab CI variables
        run: |
          export CI_COMMIT_TIMESTAMP="$(TZ=UTC git log -1 --date=format-local:%Y-%m-%dT%H:%M:%SZ --format=%cd)"
          if [ "${{ github.ref_type }}" = tag ]; then export CI_COMMIT_TAG="${{ github.ref_name }}"; fi
          ./gradlew -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 --add-opens=java.base/java.io=ALL-UNNAMED" ${{ matrix.tasks }} --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: tacit-${{ matrix.name }}
          path: ${{ matrix.artifact-paths }}
          if-no-files-found: error
