name: Docker Push

on:
  workflow_dispatch:
  push:
    # Publish `dev` as Docker `latest` image.
    branches:
      - dev
    paths-ignore:
      - '**.md'
      - '.github/**'

    # Publish Tacit release tags (e.g. `v26.9.2-tacit.1`) as releases.
    # Mirrored upstream tags (`v26.x.y`) are intentionally not matched.
    tags:
      - 'v*-tacit.*'

jobs:
  push:
    uses: dfuchss/actions/.github/workflows/docker.yml@main
    with:
      image-name: tacit
      push: true
